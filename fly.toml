# Warden on Fly.io. Region fra: the Binance Web3 API checks the server's country; Germany is allowed, the US is not.
app = "warden"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  WARDEN_DATA = "/data"
  BINANCE_BAW_DIR = "/data/baw"
  RUN_SCHEDULER = "1"
  PORT = "8080"

[[mounts]]
  source = "warden_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
